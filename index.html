let factTopic = 0;

function factQuestion(kind,a,b) {
  switch(kind) {
    case 0: return [`${a} × ${b}`,a*b,`${b} × ${a} = ${a*b}`];
    case 1: return [`${a*b} ÷ ${a}`,b,`${a} × ${b} = ${a*b}`];
    case 2: return [`${a}²`,a**2,`${a} × ${a} = ${a**2}`];
    case 3: return [`${a}³`,a**3,`${a}² × ${a} = ${a**2} × ${a} = ${a**3}`];
    case 4: return [`√${a**2}`,a,`${a}² = ${a**2}`];
    case 5: return [`∛${a**3}`,a,`${a}³ = ${a**3}`];
  }
}
function startFactQuiz() {
  const max = factKinds[factTopic][5];
  const pool = [];
  for(let a=2;a<=max;a++){
    for(let b=factTopic === 0 ? a : 2; b <= (factTopic < 2 ? max : 2); b++){
      pool.push(factQuestion(factTopic,a,b));

  const questions = [];
  while(questions.length < 5) questions.push(...pool.splice(Math.floor(Math.random()*pool.length),1));

  factQuiz = true;
  renderFactsFocus();
}

    <defs><marker id="minus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#643eb5"/></marker></defs>
    <path d="M20 49 H284" stroke="#625479" stroke-width="2"/>
    ${Array.from({length:12},(_,i)=>{const n=i-6;const pos=x(n);return `<path d="M${pos} 45 v8" stroke="#625479"/><text x="${pos}" y="72" text-anchor="middle" font-size="11" font-weight="${n===0?800:500}">${n<0?'−'+(-n):n}</text>`;}).join('')}
    <g fill="none" stroke="#643eb5" stroke-width="2">${stops.slice(1).map((stop,i)=>segment(stops[i],stop)).join('')}</g>
    ${dots.map((n,i)=>`<circle cx="${x(n)}" cy="49" r="4.5" fill="${i===0?'#166047':'#643eb5'}"/>`).join('')}</svg>`;
}
function minusHTML() {
  const [en,id,questionEn,questionId,start,end,equation,whyEn,whyId,kind] = minusExamples[minusIndex];
  const correct = i => minusAnswers[i]?.trim() && Number(minusAnswers[i]) === minusQuiz[i][2];
  const score = minusQuiz.filter((_,i)=>correct(i)).length;
  return `<h2>${t('minus')}</h2>
    <div class="minus-roles">
    <div class="card"><strong>${tr('A number’s sign','Tanda bilangan')}</strong><p>−4 · ${tr('a position below zero','posisi di bawah nol')}</p></div>
    <div class="card"><strong>${tr('An operation','Operasi')}</strong><p>2 − 5 · ${tr('subtract 5 from 2','kurangi 2 dengan 5')}</p></div>
    <div class="card"><strong>${tr('The opposite','Lawan bilangan')}</strong><p>−(−4) · ${tr('the opposite of −4','lawan dari −4')}</p></div></div>
    <div class="grid"><aside class="topics" aria-label="${tr('Minus examples','Contoh tanda minus')}">${minusExamples.map(([name,other],i)=>`<button data-minus="${i}" aria-current="${i===minusIndex}">${tr(name,other)}</button>`).join('')}</aside>
    <article class="card"><h3>${tr(en,id)}</h3><p>${tr(questionEn,questionId)}</p>
    <button type="button" id="minus-reveal" aria-expanded="${minusRevealed}">${minusRevealed?tr('Hide the explanation','Sembunyikan penjelasan'):tr('Reveal the visual','Lihat visualnya')}</button>
    ${minusRevealed?`<div class="example">${minusLine(start,end,kind)}<p class="mathline">${equation}</p><p>${tr(whyEn,whyId)}</p></div>`:''}</article></div>
    <details class="card" id="minus-rules"><summary>${tr('Sign rules for multiplication and division','Aturan tanda untuk perkalian dan pembagian')}</summary>
    <p>${tr('Think of multiplying by −1 as reflecting across zero. One reflection changes the sign. Two reflections return you to the starting side.','Bayangkan perkalian dengan −1 sebagai pencerminan terhadap nol. Satu pencerminan mengubah tanda. Dua pencerminan mengembalikanmu ke sisi semula.')}</p>
    <div class="mathline">6 → −6 → 6</div>
    <p>${tr('For nonzero factors, opposite signs give a negative product and matching signs give a positive product. For exact division, check the sign by multiplying back.','Untuk faktor tak nol, tanda berbeda menghasilkan perkalian negatif, dan tanda sama menghasilkan perkalian positif. Untuk pembagian habis, periksa tanda dengan mengalikan kembali.')}</p>
    <div class="mathline">(−2) × (−3) = 6 · 6 ÷ (−3) = −2</div></details>
    <article class="card"><h3 id="minus-quiz-heading" tabindex="-1">${tr('Quick check','Cek pemahaman')}</h3><form id="minus-quiz">
    ${minusSubmitted?`<p class="feedback good" role="status">${tr('Score','Nilai')} <strong>${score} / ${minusQuiz.length}</strong></p>`:''}
    <ol class="fact-questions minus-questions">${minusQuiz.map(([prompt,local,answer,reason],i)=>`<li><label for="minus-q${i}">${tr(prompt,local)}</label>
    <input type="number" step="1" id="minus-q${i}" name="${i}" value="${minusAnswers[i]??''}" ${minusSubmitted?'readonly':''}>
    ${minusSubmitted?`<p class="feedback ${correct(i)?'good':'bad'}">${correct(i)?t('Correct.'):`${t('Answer:')} ${answer}`} · ${reason}</p>`:''}</li>`).join('')}</ol>
    ${minusSubmitted?`<button type="button" id="minus-retry">${t('Try again')}</button>`:`<button class="primary" type="submit">${t('Check answer')}</button>`}</form></article>`;
}

const main = document.querySelector('#main');
let mode = 'facts';
let topic = 0;
let practiceIndex = 0;
let practiceAnswers = {};
let examAnswers = {};
let submitted = false;
let confirmBlank = false;

function choiceFields(item, index, selected, locked) {
  return item[2].map((choice, i) => `<label class="choice"><input type="radio" name="q${index}" value="${i}" ${selected === i ? 'checked' : ''} ${locked ? 'disabled' : ''}> ${choiceText(choice)}</label>`).join('');
}
function score(items, answers) {
  return items.reduce((total, item, i) => total + Number(answers[i] === item[3]), 0);
}
function openMode(next) {
  mode = next;
  render();
  const title = main.querySelector('h2');
  title.tabIndex = -1;
  title.focus();
}
function reviewHTML() {
  const item = reviewTopics()[topic];
  const topicButtons = (start, end) => reviewTopics().slice(start, end).map(([name], i) =>
    `<button data-topic="${start+i}" aria-current="${start+i === topic}">${name}</button>`).join('');
  return `<h2>${t('review')}</h2><div class="grid"><aside class="topics" aria-label="${t('Review topics')}">
    <p class="source">${t('Lesson slides')}</p>${topicButtons(0,4)}<p class="source">${t('ASTS worksheet')}</p>${topicButtons(4,7)}
    </aside><article class="card" id="lesson"><p class="source">${item[1]}</p><h3>${item[0]}</h3>
    <p>${item[2]}</p><div class="example"><p><strong>${t('Worked examples')}</strong></p>${item[3].map(example => `<p>${example}</p>`).join('')}</div>
    <button class="primary" id="practice-topic">${t('Practise this topic')}</button></article></div>
    <details class="card"><summary>${t('Source and notation notes')}</summary>
      <p>${tr("In the slides, KPK means LCM. A decimal comma such as 2,6 means 2.6. On slide 27, use subtraction from right to left. Slide 31’s 0.6 × 0.25 requires three decimal places. Slide 40’s second “Try!” includes a percent sign in a fraction-to-percentage prompt. If the intended input is 2 5/6, it converts to 283 1/3%. The last six slides cover an optional converter activity and a quiz link.","Pada slide, KPK berarti kelipatan persekutuan terkecil. Koma seperti 2,6 menandai desimal. Pada slide 27, lakukan pengurangan dari kanan ke kiri. Hasil 0,6 × 0,25 pada slide 31 memerlukan tiga tempat desimal. Soal “Try!” kedua pada slide 40 memuat tanda persen. Jika yang dimaksud adalah pecahan 2 5/6, hasilnya 283 1/3%. Enam slide terakhir berisi kegiatan konverter dan tautan kuis.")}</p>
      <p>${tr("In the ASTS worksheet, a colon means division and a small 3 beside a radical means cube root. Q9 gives enough information for the calendar date. A weekday requires a year. Q12(b)–(e) repeat the same comparison. Q17 has answers a, b and c, and Q19 has a, c and d. Q20(b) implies liters. Q20(c) fills 25 half-kilogram bags and leaves 1/4 kg for a partly filled bag.","Pada lembar ASTS, titik dua berarti bagi dan angka 3 kecil di tanda akar berarti akar pangkat tiga. Soal 9 membutuhkan tahun untuk menentukan nama hari. Soal 12(b)–(e) mengulang perbandingan yang sama. Jawaban soal 17 adalah a, b, dan c, sedangkan soal 19 adalah a, c, dan d. Satuan soal 20(b) dipahami sebagai liter. Soal 20(c) mengisi 25 kantong setengah kilogram dan menyisakan 1/4 kg untuk satu kantong yang terisi sebagian.")}</p>
    </details>`;
}
function practiceHTML() {
  const item = practice[practiceIndex];
  const chosen = practiceAnswers[practiceIndex];
  const checked = chosen !== undefined;
  return `<h2>${t('practice')}</h2><p>${t('Check each answer for immediate feedback.')}</p>
    <label for="jump">${t('Choose a question')}</label> <select id="jump">${practice.map((q,i) => `<option value="${i}" ${i===practiceIndex?'selected':''}>${i+1}. ${reviewTopics()[q[0]][0]}</option>`).join('')}</select>
    <form class="card" id="practice-form"><p class="source">${tr('Question','Soal')} ${practiceIndex+1} / ${practice.length} · ${reviewTopics()[item[0]][0]}</p>
    <fieldset><legend>${promptText(item,practiceIndex,'practice')}</legend><div class="options">${choiceFields(item, practiceIndex, chosen, checked)}</div></fieldset>
    <div id="practice-feedback" aria-live="polite">${checked ? `<p class="feedback ${chosen===item[3]?'good':'bad'}"><strong>${chosen===item[3]?t('Correct.'):t('Answer:')+' '+choiceText(item[2][item[3]])+'.'}</strong></p>` : ''}</div>
    <div class="actions" style="margin-top:14px">${checked?`<button type="button" id="retry-question">${t('Try again')}</button>`:`<button class="primary" type="submit">${t('Check answer')}</button>`}
    <button type="button" id="previous" ${practiceIndex===0?'disabled':''}>${t('Previous')}</button>
    <button type="button" id="next" ${practiceIndex===practice.length-1?'disabled':''}>${t('Next')}</button></div>${solutionHTML('practice',practiceIndex)}</form>
    <p class="small">${tr('Checked','Diperiksa')} ${Object.keys(practiceAnswers).length} / ${practice.length} · ${tr('Correct','Benar')} ${score(practice,practiceAnswers)}</p>`;
}
function examHTML() {
  if (submitted) {
    const correct = score(exam, examAnswers);
    const answered = Object.keys(examAnswers).length;
    return `<h2>${t('Mock exam results')}</h2><div class="card"><p class="score">${correct} / ${exam.length} · ${Math.round(correct/exam.length*100)}%</p>
    <p>${correct} ${tr('correct','benar')} · ${answered-correct} ${tr('incorrect','salah')} · ${exam.length-answered} ${tr('blank','kosong')}</p><button class="primary" id="retake">${t('Retake exam')}</button></div>
    <h3>${t('Answer key')}</h3>
    <ol class="exam-list">${exam.map((item,i) => {
      const answer = examAnswers[i];
      const correct = answer === item[3];
      return `<li class="${correct?'good':'bad'}"><strong>${i+1}. ${promptText(item,i,'exam')}</strong><br>${t('Your answer:')} ${choiceText(item[2][answer])}<br>${t('Correct answer:')} ${choiceText(item[2][item[3]])}${solutionHTML('exam',i)}</li>`;
    }).join('')}</ol>`;
  }
  return `<h2>${t('exam')}</h2><p>${tr(`${exam.length} questions · 1 point per correct answer. Your score and answer key appear after submission.`,`${exam.length} soal · 1 poin per jawaban benar. Nilai dan kunci jawaban muncul setelah ujian dikumpulkan.`)}</p>
    <form id="exam-form">${exam.map((item,i) => `<fieldset class="card"><legend>${i+1}. ${promptText(item,i,'exam')}</legend>
      <div class="options">${choiceFields(item,i,examAnswers[i],false)}</div></fieldset>`).join('')}
    <p id="exam-progress" aria-live="polite"></p>
    <button type="submit" class="primary">${confirmBlank?t('Submit with blanks'):t('Submit exam')}</button></form>`;
}
function updateExamProgress() {
  const answered = Object.keys(examAnswers).length;
  const blank = exam.length - answered;
  main.querySelector('#exam-progress').textContent = confirmBlank && blank
    ? tr(`${blank} unanswered. Submit again to score blanks as zero, or finish those questions first.`,`${blank} soal belum dijawab. Selesaikan dulu atau kumpulkan lagi untuk memberi nilai nol pada soal kosong.`)
    : tr(`${answered} of ${exam.length} answered`,`${answered} dari ${exam.length} dijawab`);
}
function showExercise(index) {
  practiceIndex = index;
  render();
  main.querySelector('#jump').focus();
}
function render() {
  document.querySelectorAll('#nav button').forEach(button => {
    button.textContent = t(button.dataset.mode);
    if (button.dataset.mode === mode) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  document.documentElement.lang = language;
  document.title = tr('Grade 7 Maths · Semester 1','Matematika Kelas 7 · Semester 1');
  document.querySelector('#grade').textContent = t('SEMESTER 1 · GRADE 7');
  document.querySelector('#heading').textContent = t('Maths Study Room');
  document.querySelector('#nav').setAttribute('aria-label',t('Learning modes'));
  document.querySelector('#language-label span').textContent = tr('Language','Bahasa');
  document.querySelector('#language').value = language;
  document.querySelector('#sources').textContent = tr(
    'Based on the 54-page lesson deck and the four-page ASTS practice sheet from Al Azhar 41 Summarecon Serpong.',
    'Berdasarkan 54 slide pelajaran dan empat halaman lembar latihan ASTS dari Al Azhar 41 Summarecon Serpong.');
  main.innerHTML = mode === 'facts' ? factsHTML() : mode === 'minus' ? minusHTML() : mode === 'visual' ? visualHTML() : mode === 'review' ? reviewHTML() : mode === 'practice' ? practiceHTML() : examHTML();
  if (mode === 'exam' && !submitted) updateExamProgress();
}
document.querySelector('#nav').addEventListener('click', event => {
  if (event.target.dataset.mode) openMode(event.target.dataset.mode);
});
document.querySelector('#language').addEventListener('change', event => {
  const selected = main.querySelector('#practice-form input:checked');
  language = event.target.value;
  try { localStorage.setItem('maths-language',language); } catch {}
  render();
  if (selected && practiceAnswers[practiceIndex] === undefined) {
    main.querySelector(`#practice-form input[value="${selected.value}"]`).checked = true;
  }
});
function showStage(index) {
  visualStep = index;
  render();
  main.querySelector(`button[data-stage="${index}"]`).focus();
}
main.addEventListener('click', event => {
  const { id, dataset } = event.target;
  if (dataset.minus !== undefined) {
    minusIndex = Number(dataset.minus);
    minusRevealed = false;
    render();
    main.querySelector(`[data-minus="${minusIndex}"]`).focus();
  }
  if (id === 'minus-reveal') {
    minusRevealed = !minusRevealed;
    render();
    main.querySelector('#minus-reveal').focus();
  }
  if (id === 'minus-retry') {
    minusAnswers = [];
    minusSubmitted = false;
    render();
    main.querySelector('#minus-q0').focus();
  }
  if (dataset.fact !== undefined) {
    factTopic = Number(dataset.fact);
    factQuiz = false;
    render();
    main.querySelector(`[data-fact="${factTopic}"]`).focus();
  }
  if (id === 'fact-start') startFactQuiz();
  if (id === 'fact-study' || id === 'fact-resume') {
    factQuiz = id === 'fact-resume';
    renderFactsFocus();
  }
  if (dataset.topic !== undefined) {
    topic = Number(dataset.topic);
    visualStep = 0;
    render();
    main.querySelector(`button[data-topic="${topic}"]`).focus();
  }
  if (dataset.stage !== undefined) showStage(Number(dataset.stage));
  if (id === 'visual-prev') showStage(visualStep - 1);
  if (id === 'visual-next') showStage(visualStep + 1);
  if (id === 'practice-topic') {
    practiceIndex = practice.findIndex(item => item[0] === topic);
    openMode('practice');
  }
  if (id === 'previous') showExercise(practiceIndex - 1);
  if (id === 'next') showExercise(practiceIndex + 1);
  if (id === 'retry-question') {
    delete practiceAnswers[practiceIndex];
    render();
    main.querySelector('input').focus();
  }
  if (id === 'retake') {
    examAnswers = {};
    submitted = false;
    confirmBlank = false;
    openMode('exam');
  }
});
main.addEventListener('input', event => {
  const input = event.target;
  if (input.form?.id === 'minus-quiz') minusAnswers[Number(input.name)] = input.value;
  if (input.form?.id === 'fact-form') factState[factTopic].answers[Number(input.name.slice(5))] = input.value;
});
main.addEventListener('change', event => {
  const input = event.target;
  if (input.id === 'fact-row') {
    factSelectedRow = Number(input.value);
    render();
    main.querySelector('#fact-row').focus();
  }
  if (input.id === 'jump') showExercise(Number(input.value));
  if (input.form?.id === 'exam-form') {
    examAnswers[Number(input.name.slice(1))] = Number(input.value);
    confirmBlank = false;
    input.form.querySelector('button').textContent = t('Submit exam');
    updateExamProgress();
  }
});
main.addEventListener('submit', event => {
  event.preventDefault();
  if (event.target.id === 'minus-quiz') {
    minusSubmitted = true;
    render();
    main.querySelector('#minus-quiz-heading').focus();
  }
  if (event.target.id === 'fact-form') {
    factState[factTopic].submitted = true;
    renderFactsFocus();
  }
  if (event.target.id === 'practice-form') {
    const selected = event.target.querySelector('input:checked');
    if (!selected) {
      main.querySelector('#practice-feedback').textContent = t('Choose an answer first.');
      event.target.querySelector('input').focus();
      return;
    }
    practiceAnswers[practiceIndex] = Number(selected.value);
    render();
    const feedback = main.querySelector('#practice-feedback');
    feedback.tabIndex = -1;
    feedback.focus();
  }
  if (event.target.id === 'exam-form') {
    if (!confirmBlank && Object.keys(examAnswers).length < exam.length) {
      confirmBlank = true;
      event.submitter.textContent = t('Submit with blanks');
      updateExamProgress();
      return;
    }
    submitted = true;
    openMode('exam');
    window.scrollTo(0,0);
  }
});
render();
</script>
</body>
</html>
